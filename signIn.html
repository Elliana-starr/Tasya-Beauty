<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasya Beauty - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css"
    integrity="sha512-t7Few9xlddEmgd3oKZQahkNI4dS6l80+eGEzFQiqtyVYdvcSG2D3Iub77R20BdotfRPA9caaRkg1tyaJiPmO0g=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FBF3EF',
            ink: '#2B2220',
            'ink-soft': '#6E5F5A',
            rose: {
              500: '#C4707F',
              600: '#B4596A',
            },
          },
          fontFamily: {
            display: ['Fraunces', 'serif'],
            body: ['"Work Sans"', 'sans-serif'],
          },
          keyframes: {
            rise: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
          animation: {
            rise: 'rise 0.6s ease-out both',
            'rise-d1': 'rise 0.6s ease-out 0.1s both',
            'rise-d2': 'rise 0.6s ease-out 0.2s both',
          },
        },
      },
    }
  </script>
</head>
<body class="font-body">
    <section class="relative overflow-hidden py-10 lg:py-16 px-5 lg:px-16 bg-paper min-h-screen">

      <img
        src="asset/images/flower2.png"
        alt=""
        class="absolute -top-6 -left-10 w-40 sm:w-56 opacity-90 pointer-events-none select-none z-0"
      />
      <img
        src="asset/images/flower1.png"
        alt=""
        class="absolute -bottom-10 -right-10 w-32 sm:w-48 opacity-90 pointer-events-none select-none z-0"
      />

      <div  data-aos="flip-left"
     data-aos-easing="ease-out-cubic"
     data-aos-duration="2000" class="relative z-10 max-w-6xl mx-auto">

        <div class="grid lg:grid-cols-2 lg:min-h-[640px] max-w-md lg:max-w-none mx-auto bg-white sm:rounded-b-3xl rounded-2xl shadow-[0_30px_60px_-25px_rgba(43,34,32,0.35)] overflow-hidden">

          <div class="relative flex flex-col justify-end lg:justify-center px-6 py-8 lg:px-12 lg:py-10">

            <div class="hidden lg:flex w-[34px] h-[34px] items-center justify-center rounded-full bg-rose-600/[0.08] text-rose-600 mb-4">
              <i class="bi bi-flower1"></i>
            </div>

            <h1 class="animate-rise font-display text-5xl leading-tight lg:text-6xl text-ink">
              Welcome
              <span class="text-rose-500 italic">Back</span>
            </h1>

            <p class="animate-rise-d1 mt-4 text-ink-soft text-base lg:text-lg lg:max-w-sm font-display">
              Your skincare journey starts here
            </p>

          </div>

          <div class="relative flex flex-col justify-end lg:justify-center px-6 py-8 lg:px-12 lg:py-10 bg-paper">

            <p class="animate-rise-d1 mt-4 text-ink-soft text-center mb-3 text-sm lg:text-lg lg:max-w-sm font-display">
              Log in to continue your skincare journey
            </p>

            <form class="space-y-5" novalidate>

                <div class="relative">
    <label for="email" class="sr-only">Email</label>
    <span class="absolute inset-y-0 left-5 flex items-center text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
    </span>
    <input
      id="email"
      type="email"
      name="email"
      placeholder="Email"
      autocomplete="email"
      required
      class="w-full rounded-full border border-gray-300 pl-14 pr-6 py-4 text-gray-600 placeholder-gray-400 focus:outline-none focus:border-pink-400 transition"
    />
  </div>


  
  <div class="relative">
  <label for="password" class="sr-only">Password</label>
  <span class="absolute inset-y-0 left-5 flex items-center text-gray-400">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
    </svg>
  </span>
  <input
    id="password"
    type="password"
    name="password"
    placeholder="Password"
    autocomplete="current-password"
    required
    class="w-full rounded-full border border-gray-300 pl-14 pr-12 py-4 text-gray-600 placeholder-gray-400 focus:outline-none focus:border-pink-400 transition"
  />
  <button
    type="button"
    id="togglePassword"
    aria-label="Show password"
    class="absolute inset-y-0 right-5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
  >
    <!-- Eye (show) icon -->
    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
    </svg>
    <!-- Eye-slash (hide) icon -->
    <svg id="eyeSlashIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.025 10.025 0 012.132-3.592m3.181-2.182A9.958 9.958 0 0112 5c4.478 0 8.268 2.943 9.542 7a9.973 9.973 0 01-4.132 5.411M3 3l18 18" />
    </svg>
  </button>
</div>


              <div class="text-right">
                <a href="#" class="text-sm text-rose-600 hover:text-rose-500 font-medium">Forgot password?</a>
              </div>

              <button
                type="submit"
                class="animate-rise-d2 w-full lg:w-fit lg:px-10 rounded-full py-3.5 font-medium flex justify-center gap-2 bg-rose-500 text-white transition-transform duration-150 hover:bg-rose-600 hover:-translate-y-px active:translate-y-0 focus-visible:outline focus-visible:outline-3 focus-visible:outline-rose-600/45 focus-visible:outline-offset-2"
              >
                Sign In
                <i class="bi bi-arrow-right"></i>
              </button>
            </form>

            <div>
              <p class="animate-rise-d1 mt-6 text-ink-soft text-center mb-3 text-sm lg:text-base font-display">
                Or continue with
              </p>
              <div class="flex flex-row gap-3">
                <button
                  type="button"
                  class="w-full rounded-full py-3.5 font-medium flex justify-center items-center gap-2 bg-white border border-gray-300 text-ink transition-transform duration-150 hover:bg-gray-50 hover:-translate-y-px active:translate-y-0 focus-visible:outline focus-visible:outline-3 focus-visible:outline-rose-600/45 focus-visible:outline-offset-2"
                >
                  <i class="bi bi-google"></i> Google
                </button>
                <button
                  type="button"
                  class="w-full rounded-full py-3.5 font-medium flex justify-center items-center gap-2 bg-white border border-gray-300 text-ink transition-transform duration-150 hover:bg-gray-50 hover:-translate-y-px active:translate-y-0 focus-visible:outline focus-visible:outline-3 focus-visible:outline-rose-600/45 focus-visible:outline-offset-2"
                >
                  <i class="bi bi-apple"></i> Apple
                </button>
              </div>
            </div>

            <p class="mt-6 text-center text-sm text-ink-soft">
              Don't have an account?
              <a href="signUp.html" class="text-rose-600 hover:text-rose-500 font-medium">Sign up</a>
            </p>

          </div>

        </div>

      </div>

    </section>
    </section>
    <script src="script.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
  AOS.init();
</script>
</body>
</html>
